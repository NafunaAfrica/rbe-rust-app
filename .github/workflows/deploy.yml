# CI/CD: GitHub builds the container, pushes it to GHCR, then triggers
# Coolify to pull the new image when a deploy webhook is configured.

name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: meta
        run: echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.COOLIFY_WEBHOOK_URL != '' }}
    steps:
      - name: Trigger Coolify redeploy
        run: |
          if [ -n "${{ secrets.COOLIFY_TOKEN }}" ]; then
            curl -fsSL -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
          else
            curl -fsSL -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}"
          fi
